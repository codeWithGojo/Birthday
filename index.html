<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101115" />
  <title>For Victory — Happy Birthday</title>
  <style>
    html,body{margin:0;min-height:100%;background:#101115;color:#fff;font-family:system-ui,sans-serif}
    #loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    #loading p{opacity:.65;font-size:.9rem}
  </style>
</head>
<body>
  <div id="loading"><div><strong>Opening Victory's universe…</strong><p>If this takes too long, refresh once.</p></div></div>
  <script>
    (async()=>{
      try{
        const url='https://cdn.jsdelivr.net/gh/codeWithGojo/Birthday@f998325530d476a3605bcb129a63029dbd6033bf/index.html';
        const r=await fetch(url,{cache:'no-store'});
        if(!r.ok) throw new Error('Could not load preserved site');
        let html=await r.text();
        html=html.replace('<head>','<head><base href="https://codewithgojo.github.io/Birthday/">');
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.getElementById('loading').innerHTML='<div><strong>Could not open the birthday site.</strong><p>'+String(err.message||err)+'</p></div>';
      }
    })();
  </script>
</body>
</html>
